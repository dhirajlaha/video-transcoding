[project]
name = "video-transcoding-platform"
version = "0.1.0"
description = "Video upload and transcoding platform with FastAPI, workers, and React."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "fastapi>=0.115.0",
    "pika>=1.3.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".bun-cache",
    ".pycache",
    ".uv-cache",
    ".venv",
    "node_modules",
    "apps/web/dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "boto3", "pika"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=backend --cov=apps --cov-report=term-missing"

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = "."
path_separator = "os"
