repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bun run lint
        language: system
        pass_filenames: false
      - id: prettier-check
        name: prettier --check
        entry: bun run format:check
        language: system
        pass_filenames: false
      - id: tsc
        name: tsc --noEmit
        entry: bun run typecheck
        language: system
        pass_filenames: false
